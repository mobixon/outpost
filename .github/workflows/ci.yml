name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: outpost
          POSTGRES_PASSWORD: outpost
          POSTGRES_DB: outpost_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U outpost" --health-interval 5s --health-timeout 5s
          --health-retries 10
      # OpenSSH as SFTP server: user outpost with the writable folder /survival.
      sftp:
        image: atmoz/sftp:alpine
        env:
          SFTP_USERS: outpost:ci-sftp-password:1001:100:survival
        ports: ['2222:22']
    env:
      # Database tests also run against PostgreSQL when this is set.
      OUTPOST_TEST_POSTGRES_URL: postgres://outpost:outpost@localhost:5432/outpost_test
      # File tests also run against the SFTP server when this is set.
      OUTPOST_TEST_SFTP_URL: sftp://outpost:ci-sftp-password@localhost:2222/survival
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # Builds the Docker image, runs it and tests it end to end in a real browser.
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUTPOST_E2E_URL: http://localhost:3000
      OUTPOST_E2E_SETUP_TOKEN: ci-setup-token-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Build the image
        run: docker build --build-arg OUTPOST_VERSION=ci-${{ github.sha }} -t outpost:ci .
      - name: Start Outpost
        run: >-
          docker run -d --name outpost -p 3000:3000
          -e OUTPOST_SECRET_KEY=ci-secret-key-0123456789abcdefghijklmnopqrstuvwxyz
          -e OUTPOST_PUBLIC_URL="$OUTPOST_E2E_URL"
          -e OUTPOST_SETUP_TOKEN="$OUTPOST_E2E_SETUP_TOKEN"
          outpost:ci
      - name: Smoke test
        run: |
          for _ in $(seq 1 30); do curl -fsS "$OUTPOST_E2E_URL/healthz" && break; sleep 1; done
          curl -fsS "$OUTPOST_E2E_URL/readyz"
          curl -sS "$OUTPOST_E2E_URL/api/v1/plugins" | grep -q '"unauthenticated"'
          curl -fsS "$OUTPOST_E2E_URL/" | grep -q '<div id="app">'
          curl -fsSI "$OUTPOST_E2E_URL/" | grep -qi "content-security-policy"
          test "$(docker inspect -f '{{.Config.User}}' outpost)" = node
      - run: pnpm install --frozen-lockfile --filter @outpost/e2e
      - run: pnpm --filter @outpost/e2e exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @outpost/e2e test
      - name: Container logs
        if: always()
        run: docker logs outpost

  # The RCON client against a real Minecraft server (itzg/minecraft-server, vanilla).
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      minecraft:
        image: itzg/minecraft-server:java25
        env:
          EULA: 'TRUE'
          TYPE: VANILLA
          VERSION: LATEST
          ONLINE_MODE: 'FALSE'
          RCON_PASSWORD: ci-rcon-password
          MEMORY: 1G
          LEVEL_TYPE: FLAT
          MAX_PLAYERS: '5'
        ports: ['25575:25575']
        options: >-
          --health-cmd mc-health --health-interval 10s --health-timeout 5s --health-retries 30
          --health-start-period 60s
    env:
      OUTPOST_TEST_RCON_URL: rcon://:ci-rcon-password@localhost:25575
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: RCON integration tests
        run: pnpm exec vitest run apps/server/src/connections/rcon.integration.test.ts
