name: Release

# A tag vX.Y.Z publishes the image ghcr.io/<owner>/outpost:X.Y.Z (also X.Y and latest) and a
# GitHub Release. Tags with a suffix, such as v0.1.0-rc.1, are pre-releases: image X.Y.Z-rc.1 only.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub Release
      packages: write # the image on GHCR
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Not a version tag: $TAG"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$version" == *-* ]]; then echo "PRERELEASE=true" >> "$GITHUB_ENV"; else echo "PRERELEASE=false" >> "$GITHUB_ENV"; fi

      - name: Build the image
        run: >-
          docker build
          --build-arg OUTPOST_VERSION="$VERSION"
          --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --label org.opencontainers.image.version="$VERSION"
          --label org.opencontainers.image.revision="$GITHUB_SHA"
          --label org.opencontainers.image.licenses=MIT
          -t "$IMAGE:$VERSION" .

      - name: Smoke test
        run: |
          docker run -d --name outpost -p 3000:3000 \
            -e OUTPOST_SECRET_KEY=release-smoke-key-0123456789abcdefghijklmnopqrstuvwxyz \
            -e OUTPOST_PUBLIC_URL=http://localhost:3000 \
            "$IMAGE:$VERSION"
          for _ in $(seq 1 30); do curl -fsS http://localhost:3000/healthz && break; sleep 1; done
          curl -fsS http://localhost:3000/readyz
          curl -fsS http://localhost:3000/ | grep -q '<div id="app">'
          docker logs outpost 2>&1 | grep -q "$VERSION"
          docker rm -f outpost

      - name: Push the image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          if [[ "$PRERELEASE" == false ]]; then
            for alias in "${VERSION%.*}" latest; do
              docker tag "$IMAGE:$VERSION" "$IMAGE:$alias"
              docker push "$IMAGE:$alias"
            done
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --title "$TAG" --verify-tag)
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            --notes "Image: \`$IMAGE:$VERSION\` (linux/amd64). Installation: [docs/install.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/install.md)."
