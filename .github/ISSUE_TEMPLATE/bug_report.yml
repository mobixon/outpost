name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please do **not** report security vulnerabilities here — see [SECURITY.md](https://github.com/mobixon/outpost/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: input
    id: version
    attributes:
      label: Outpost version
      placeholder: e.g. 0.1.0 or the image tag
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How is Outpost deployed?
      options:
        - Docker Compose
        - docker run
        - CapRover / Docker Swarm
        - Other
  - type: input
    id: game-server
    attributes:
      label: Game server
      placeholder: e.g. itzg/minecraft-server, Fabric 1.21.x
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, tokens and IP addresses before pasting.
      render: text
