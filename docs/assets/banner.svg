<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Outpost</title>
  <desc id="desc">A lightweight, self-hosted admin panel for Minecraft servers over RCON.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1516"/>
      <stop offset="1" stop-color="#0d2624"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1516" stop-opacity="1"/>
      <stop offset="1" stop-color="#0b1516" stop-opacity="0"/>
    </linearGradient>
    <pattern id="blocks" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="38" height="38" x="1" y="1" rx="3" fill="#134e4a" opacity="0.35"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#ground)"/>
    <!-- A field of blocks on the right, a few of them lit like ore. -->
    <rect x="760" width="520" height="360" fill="url(#blocks)"/>
    <g fill="#14b8a6">
      <rect x="1001" y="81" width="38" height="38" rx="3" opacity="0.55"/>
      <rect x="1121" y="161" width="38" height="38" rx="3" opacity="0.4"/>
      <rect x="921" y="241" width="38" height="38" rx="3" opacity="0.3"/>
      <rect x="1201" y="41" width="38" height="38" rx="3" opacity="0.3"/>
      <rect x="1161" y="281" width="38" height="38" rx="3" opacity="0.5"/>
    </g>
    <g fill="#f59e0b">
      <rect x="1081" y="241" width="38" height="38" rx="3" opacity="0.45"/>
      <rect x="961" y="161" width="38" height="38" rx="3" opacity="0.3"/>
    </g>
    <rect x="760" width="360" height="360" fill="url(#fade)"/>

    <!-- Logo: the flag of the Outpost favicon. -->
    <g transform="translate(88 92) scale(3.5)">
      <rect width="32" height="32" rx="7" fill="#0f766e"/>
      <path d="M11 25V7" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M12 8h10l-2.5 3.5L22 15H12z" fill="#fff"/>
      <path d="M7 25h18" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
      <text x="222" y="150" fill="#f0fdfa" font-size="72" font-weight="700" letter-spacing="-1.5">Outpost</text>
      <text x="224" y="192" fill="#99f6e4" font-size="26" font-weight="500">Admin panel for your Minecraft server</text>
      <text x="90" y="262" fill="#cbd5e1" font-size="22">Console, players, scheduler and team roles over RCON.</text>
      <text x="90" y="296" fill="#cbd5e1" font-size="22">One light container next to the server you already run.</text>
    </g>
  </g>
</svg>
